<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SAM 3D Objects + HiCache</title>
  <desc id="desc">Segmentation and sparse structure remain unchanged; caching begins at the structured SLaT Euler loop.</desc>
  <rect width="1200" height="420" rx="22" fill="#020617"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>.t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cbd5e1}.muted{fill:#94a3b8}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#475569;stroke-width:1.5;stroke-dasharray:6 5}.box{fill:#111827;stroke:#334155;stroke-width:1.5}</style>
  </defs>
  <text class="t" x="38" y="46" font-size="25" font-weight="700">SAM 3D Objects + HiCache</text>
  <text class="t muted" x="38" y="72" font-size="14">Segmentation and sparse structure remain unchanged; caching begins at the structured SLaT Euler loop.</text>
  <g transform="translate(25 178)"><rect class="box" width="140" height="74" rx="12" stroke="#8b5cf6"/><text class="t" x="70" y="32" text-anchor="middle" font-size="14" font-weight="700">Image + mask</text><text class="m muted" x="70" y="55" text-anchor="middle" font-size="11">object crop</text></g>
  <path class="line" d="M165 215L205 215"/>
  <g transform="translate(205 165)"><rect class="box" width="175" height="100" rx="12" stroke="#8b5cf6"/><text class="t" x="87.5" y="45" text-anchor="middle" font-size="14" font-weight="700">Encoders</text><text class="m muted" x="87.5" y="68" text-anchor="middle" font-size="11">condition + pointmap</text></g>
  <path class="line" d="M380 215L425 215"/>
  <g transform="translate(425 165)"><rect class="box" width="175" height="100" rx="12" stroke="#8b5cf6"/><text class="t" x="87.5" y="45" text-anchor="middle" font-size="14" font-weight="700">Sparse structure</text><text class="m muted" x="87.5" y="68" text-anchor="middle" font-size="11">unchanged</text></g>
  <path class="line" d="M600 215L650 215"/>
  <rect x="650" y="105" width="390" height="220" rx="16" fill="#0f172a" stroke="#8b5cf6"/><text class="t" x="675" y="138" font-size="16" font-weight="700">SLaT Euler loop</text>
  <g transform="translate(680 170)"><rect class="box" width="135" height="82" rx="12" stroke="#f59e0b"/><text class="t" x="67.5" y="36" text-anchor="middle" font-size="14" font-weight="700">Dynamics</text><text class="m muted" x="67.5" y="59" text-anchor="middle" font-size="11">compute anchor</text></g>
  <path class="line" d="M815 211L845 211"/>
  <g transform="translate(845 150)"><rect class="box" width="165" height="122" rx="12" stroke="#22c55e"/><text class="t" x="82.5" y="56" text-anchor="middle" font-size="14" font-weight="700">Hermite</text><text class="m muted" x="82.5" y="79" text-anchor="middle" font-size="11">leaf-wise history</text></g>
  <path class="dash" d="M928 272V302H748V252"/><text class="m muted" x="838" y="316" text-anchor="middle" font-size="10">fallback preserves original dynamics path</text>
  <path class="line" d="M1040 215L1080 215"/>
  <g transform="translate(1080 178)"><rect class="box" width="95" height="74" rx="12" stroke="#38bdf8"/><text class="t" x="47.5" y="32" text-anchor="middle" font-size="14" font-weight="700">Object</text><text class="m muted" x="47.5" y="55" text-anchor="middle" font-size="11">mesh</text></g>
  <text class="m" x="845" y="372" text-anchor="middle" font-size="12">PyTree leaves keep structure, dtype, device, and run identity</text>
</svg>
